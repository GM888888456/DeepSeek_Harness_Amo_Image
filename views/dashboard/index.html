<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f6"><title>我想永远陪着你-关系</title>
<link rel="stylesheet" href="./terminal-base.css?v=6"><link rel="stylesheet" href="./compat.css?v=5"><link rel="stylesheet" href="./tweak.css?v=5">
<style>
.relation-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:10px}
.relation-form .wide{grid-column:1/-1}.relation-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.relation-row:last-child{border-bottom:0}.relation-name{font-size:13px;font-weight:600}.relation-meta{font-size:11px;color:var(--muted);margin-top:3px}
.relation-actions{display:flex;gap:7px;align-items:center}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{border-right:1px solid var(--line);padding:4px 9px}.metric:last-child{border:0}.metric strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.metric span{font-size:11px;color:var(--muted)}.pill{white-space:nowrap}
@media(max-width:460px){.relation-form{grid-template-columns:1fr}.relation-form .wide{grid-column:auto}.relation-row{align-items:flex-start}}
</style>
</head>
<body><div class="wrap">
<header><div class="brand"><span class="dot"></span><span>关系网络</span></div><span class="clock" id="clock">Amo · Relationship</span><button class="icon-btn" id="theme" title="切换深浅色">◐</button></header>
<nav class="tabs">
<button class="tab on" data-tab="people">人物</button><button class="tab" data-tab="relations">关系</button><button class="tab" data-tab="history">互动</button><button class="tab" data-tab="events">社会事件</button>
</nav>
<section class="pane" id="pane-people">
<div class="card"><div class="card-title"><span>关系总览</span><span class="pill" id="connection">连接中</span></div>
<div class="metric-row"><div class="metric"><strong id="countPeople">—</strong><span>人物</span></div><div class="metric"><strong id="countRelations">—</strong><span>关系</span></div><div class="metric"><strong id="countInteractions">—</strong><span>互动</span></div></div></div>
<div class="card"><div class="card-title"><span>新增人物 / 组织</span><span class="hint">身份由关系模块统一维护</span></div>
<div class="relation-form"><label class="block">名称<input class="input" id="personName" placeholder="姓名或组织名称"></label>
<label class="block">主体类型<select class="input" id="entityType"><option value="person">个人</option><option value="organization">组织</option></select></label>
<label class="block wide">别名（逗号分隔）<input class="input" id="aliases" placeholder="常用称呼、简称"></label>
<div class="wide"><button class="btn" id="addPerson">保存人物</button></div></div></div>
<div class="card"><div class="card-title"><span>人物档案</span><input class="input" id="search" style="max-width:55%" placeholder="搜索姓名 / 别名"></div><div id="peopleList"><div class="empty">正在读取…</div></div></div>
</section>
<section class="pane" id="pane-relations" hidden>
<div class="card"><div class="card-title"><span>建立关系</span><span class="hint">关系是有方向的主体 → 客体</span></div>
<div class="relation-form"><label class="block">主体<select class="input" id="subject"></select></label>
<label class="block">关系类型<select class="input" id="relationType"><option value="family">家人</option><option value="friend">朋友</option><option value="colleague">同事</option><option value="customer">客户</option><option value="supplier">供应商</option><option value="doctor">医生</option><option value="bank_manager">银行经理</option><option value="partner">合作伙伴</option><option value="acquaintance">熟人</option><option value="lover">恋人</option></select></label>
<label class="block wide">客体<select class="input" id="object"></select></label>
<label class="block">熟悉度（0–100）<input class="input" id="familiarity" type="number" min="0" max="100" value="0"></label>
<label class="block">信任度（0–100）<input class="input" id="trust" type="number" min="0" max="100" value="0"></label>
<label class="block wide">备注<input class="input" id="relationNote" placeholder="关系来源、背景或边界"></label>
<div class="wide"><button class="btn" id="saveRelation">保存关系</button></div></div></div>
<div class="card"><div class="card-title"><span>关系网络</span><button class="link" id="refreshRelations">刷新</button></div><div id="relationList"><div class="empty">暂无关系</div></div></div>
</section>
<section class="pane" id="pane-history" hidden><div class="card"><div class="card-title"><span id="historyTitle">互动历史</span></div><div id="interactionList"><div class="empty">从人物列表选择一个人</div></div></div></section>
<section class="pane" id="pane-events" hidden><div class="card"><div class="card-title"><span>社会事件</span><span class="hint">邀请、聚会、纪念日与共同活动</span></div><div class="relation-form"><label class="block wide">事件名称<input class="input" id="eventTitle" placeholder="例如：周末聚餐"></label><label class="block">开始时间<input class="input" id="eventStart" type="datetime-local"></label><label class="block">地点<input class="input" id="eventLocation" placeholder="地点"></label><label class="block wide">参与者<select class="input" id="eventParticipants" multiple size="4"></select></label><div class="wide"><button class="btn" id="saveEvent">保存事件</button></div></div></div><div class="card"><div class="card-title"><span>事件列表</span><button class="link" id="refreshEvents">刷新</button></div><div id="eventList"><div class="empty">暂无事件</div></div></div></section>
<footer>Relationship 管理身份与社会关系；Terminal 负责事件、日程和行动协调。</footer>
</div><script type="module" src="./app.js?v=1.0.0"></script>
<script>(function(){const e=document.getElementById("clock");function t(){e.textContent=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}t();setInterval(t,20000)})();</script>
</body></html>
