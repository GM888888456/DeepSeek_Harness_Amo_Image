<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amo · Relationship</title>
<style>
:root{color-scheme:light dark;--bg:#f4f4f6;--panel:#fff;--fg:#25252b;--muted:#85858f;--line:#dedee3;--accent:#e8489a;--ok:#0284c7;--danger:#c45b70}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e22;--panel:#25252b;--fg:#ededf1;--muted:#a0a0aa;--line:#3a3a42;--accent:#f06eae;--ok:#38bdf8;--danger:#ef8294}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:22px 18px 48px}.top{display:flex;align-items:end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
h1{font-size:19px;font-weight:650;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.status{font-size:12px;color:var(--muted)}nav{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:0 0 20px}
nav button{appearance:none;border:0;background:none;color:var(--muted);padding:13px 2px 10px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.active{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 13px;font-weight:650}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;min-width:0}
input{flex:1;min-width:150px}button.action{background:var(--fg);color:var(--bg);border:0;border-radius:6px;padding:9px 13px;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer}
.list{display:flex;flex-direction:column}.item{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.name{font-weight:600}.meta{font-size:12px;color:var(--muted);margin-top:2px}.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border-right:1px solid var(--line);padding:4px 10px}.metric:last-child{border:0}.num{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}.label{font-size:12px;color:var(--muted)}
.hidden{display:none!important}.empty{padding:24px 8px;text-align:center;color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:600px){main{padding:16px 12px 32px}.grid{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:span 2}.top{align-items:start;flex-direction:column}}
</style>
</head>
<body><main>
<header class="top"><div><h1>Amo · Relationship</h1><div class="sub">人物身份 · 社会关系 · 互动历史</div></div><div class="status" id="status">正在连接…</div></header>
<nav><button class="active" data-tab="people">人物</button><button data-tab="relations">关系网络</button><button data-tab="activity">互动记录</button></nav>
<section id="overview" class="panel"><div class="grid"><div class="metric"><div class="num" id="countPeople">—</div><div class="label">人物</div></div><div class="metric"><div class="num" id="countRelations">—</div><div class="label">关系</div></div><div class="metric"><div class="num" id="countInteractions">—</div><div class="label">互动记录</div></div></div></section>
<section id="tab-people">
<div class="panel"><h2>人物档案</h2><div class="row"><input id="personName" placeholder="姓名 / 组织名称"><select id="entityType"><option value="person">个人</option><option value="organization">组织</option></select><button class="action" id="addPerson">添加人物</button></div><div class="hint">身份和别名由关系模块统一维护；Terminal 只读取当前事件所需的关系上下文。</div></div>
<div class="panel"><div class="row"><h2 style="margin:0;flex:1">人物列表</h2><input id="search" placeholder="搜索姓名或别名"></div><div class="list" id="peopleList"><div class="empty">暂无人物</div></div></div>
</section>
<section id="tab-relations" class="hidden">
<div class="panel"><h2>建立关系</h2><div class="row"><select id="subject"></select><select id="relationType"><option value="family">家人</option><option value="friend">朋友</option><option value="colleague">同事</option><option value="customer">客户</option><option value="supplier">供应商</option><option value="doctor">医生</option><option value="bank_manager">银行经理</option><option value="partner">合作伙伴</option><option value="acquaintance">熟人</option></select><select id="object"></select><button class="action" id="saveRelation">保存关系</button></div><div class="row" style="margin-top:10px"><label class="label">熟悉度 <input id="familiarity" type="number" min="0" max="100" value="0" style="width:82px"></label><label class="label">信任度 <input id="trust" type="number" min="0" max="100" value="0" style="width:82px"></label></div></div>
<div class="panel"><h2>关系网络</h2><div class="list" id="relationList"><div class="empty">暂无关系</div></div></div>
</section>
<section id="tab-activity" class="hidden"><div class="panel"><h2>最近互动</h2><div class="list" id="interactionList"><div class="empty">选择人物后查看互动历史</div></div></div></section>
<div class="hint">Amo Relationship · 关系数据独立存储。业务模块通过 Terminal 协调，不直接互相依赖。</div>
</main>
<script>
const root='/DeepSeek_Harness_Amo_Relationship';
const $=id=>document.getElementById(id);
async function api(path,body){const opt=body===undefined?{method:'GET'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};const r=await fetch(root+path,opt);const j=await r.json();if(!r.ok||j.code===1)throw new Error(j.msg||('HTTP '+r.status));return j.data||{}}
let people=[],selected='';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function labelType(v){return ({person:'个人',organization:'组织'})[v]||v||'个人'}
function relationLabel(v){return ({family:'家人',friend:'朋友',colleague:'同事',customer:'客户',supplier:'供应商',doctor:'医生',bank_manager:'银行经理',partner:'合作伙伴',acquaintance:'熟人'})[v]||v}
async function refresh(){try{const s=await api('/relationship/snapshot');const c=s.counts||{};$('countPeople').textContent=c.people??0;$('countRelations').textContent=c.relationships??0;$('countInteractions').textContent=c.interactions??0;await loadPeople();$('status').textContent='已连接'}catch(e){$('status').textContent='连接失败：'+e.message}}
async function loadPeople(){const d=await api('/relationship/people',{q:$('search').value||''});people=d.items||[];$('peopleList').innerHTML=people.length?people.map(p=>'<div class="item"><div><div class="name">'+esc(p.display_name)+'</div><div class="meta">'+esc(p.person_id)+' · '+labelType(p.entity_type)+'</div></div><button class="ghost" data-person="'+esc(p.person_id)+'">关系与互动</button></div>').join(''):'<div class="empty">暂无人物</div>';const opts=people.map(p=>'<option value="'+esc(p.person_id)+'">'+esc(p.display_name)+'</option>').join('');$('subject').innerHTML=opts;$('object').innerHTML=opts}
async function loadRelations(){const d=await api('/relationship/edges',{});const rows=d.items||[];$('relationList').innerHTML=rows.length?rows.map(r=>{const a=people.find(p=>p.person_id===r.subject_id)?.display_name||r.subject_id;const b=people.find(p=>p.person_id===r.object_id)?.display_name||r.object_id;return '<div class="item"><div><div class="name">'+esc(a)+' — '+esc(b)+'</div><div class="meta">熟悉度 '+r.familiarity+' · 信任度 '+r.trust+'</div></div><span class="pill">'+esc(relationLabel(r.relation_type))+'</span></div>'}).join(''):'<div class="empty">暂无关系</div>'}
async function loadInteractions(pid){selected=pid;const d=await api('/relationship/interactions',{person_id:pid,limit:50});const rows=d.items||[];$('interactionList').innerHTML=rows.length?rows.map(r=>'<div class="item"><div><div class="name">'+esc(r.summary||r.kind)+'</div><div class="meta">'+new Date(r.occurred_at*1000).toLocaleString()+' · '+esc(r.channel)+'</div></div></div>').join(''):'<div class="empty">暂无互动记录</div>'}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));['people','relations','activity'].forEach(k=>$('tab-'+k).classList.toggle('hidden',k!==b.dataset.tab));if(b.dataset.tab==='relations')loadRelations()}));
$('addPerson').onclick=async()=>{try{const name=$('personName').value.trim();if(!name)return;await api('/relationship/person/save',{display_name:name,entity_type:$('entityType').value});$('personName').value='';await refresh()}catch(e){alert(e.message)}};
$('search').oninput=()=>loadPeople().catch(e=>$('status').textContent=e.message);
$('peopleList').onclick=e=>{const b=e.target.closest('[data-person]');if(b){loadInteractions(b.dataset.person).then(()=>document.querySelector('[data-tab="activity"]').click())}};
$('saveRelation').onclick=async()=>{try{await api('/relationship/edge/save',{subject_id:$('subject').value,object_id:$('object').value,relation_type:$('relationType').value,familiarity:Number($('familiarity').value),trust:Number($('trust').value)});await loadRelations();await refresh()}catch(e){alert(e.message)}};
refresh();
</script></body></html>
